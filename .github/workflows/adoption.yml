# The adoption test: generate, build and run every example — with the SDK
# and the plugins at the versions given, or at the versions the examples pin.
#
# Called from the SDK and plugins repositories on their pull requests (with
# the pull request's commit), from this repository's own CI, and nightly
# against the main branches.
name: adoption

on:
  workflow_call:
    inputs:
      sdk_ref:
        description: SDK commit or tag to build against (empty = the version each example pins)
        type: string
        default: ""
      plugins_ref:
        description: plugins commit or tag to take every installed plugin from (empty = the released versions in each lock)
        type: string
        default: ""
      examples:
        description: space-separated example directories (empty = all)
        type: string
        default: ""
      w17ctl_version:
        description: w17ctl release to run (empty = the newest, prereleases included)
        type: string
        default: ''
    secrets:
      W17_TOKEN:
        description: API token of a machine account on the console
        required: true

permissions:
  contents: read

jobs:
  # Which examples to run: the `examples` input, or every directory with a
  # w17/lock.yaml.
  list:
    runs-on: ubuntu-latest
    outputs:
      examples: ${{ steps.list.outputs.examples }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: wandering-compiler/examples
          ref: ${{ github.repository == 'wandering-compiler/examples' && github.sha || 'main' }}
          path: examples

      - id: list
        working-directory: examples
        run: |
          set -euo pipefail
          list="${{ inputs.examples }}"
          if [ -z "$list" ]; then
            # `if`, not `[ -f … ] && echo`: the last directory without a lock
            # would end the loop non-zero and set -e would stop the step silently.
            for d in */; do
              if [ -f "$d/w17/lock.yaml" ]; then list="$list ${d%/}"; fi
            done
          fi
          [ -n "$list" ] || { echo "::error::no example (a directory with w17/lock.yaml) found"; exit 1; }
          # shellcheck disable=SC2086 # the list is space-separated on purpose
          json="$(printf '%s\n' $list | jq -R . | jq -cs .)"
          echo "examples=$json" >> "$GITHUB_OUTPUT"
          echo "examples: $json"

  # One job per example, in parallel: each example is its own project with its
  # own stack, so nothing is shared between them, and the slowest example sets
  # the run's length rather than the sum of all of them.
  example:
    needs: list
    name: ${{ matrix.example }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        example: ${{ fromJSON(needs.list.outputs.examples) }}
    env:
      W17_TOKEN: ${{ secrets.W17_TOKEN }}
      # A runner's checkout has no branch, and `w17ctl test` syncs the schema
      # under the branch's initiative. One fixed name for every run, so CI does
      # not leave an initiative per branch on the console.
      W17_INITIATIVE: ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: wandering-compiler/examples
          # This repository's own runs test the change under review; a call
          # from the SDK or the plugins tests the examples as they are.
          ref: ${{ github.repository == 'wandering-compiler/examples' && github.sha || 'main' }}
          path: examples

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: inputs.plugins_ref != ''
        with:
          repository: wandering-compiler/plugins
          ref: ${{ inputs.plugins_ref }}
          path: plugins

      - name: Install w17ctl
        env:
          GH_API_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$HOME/bin"
          v="${{ inputs.w17ctl_version }}"
          if [ -n "$v" ]; then sel=(--version "$v"); else sel=(--pre); fi
          # --pre lists releases through the GitHub API, which refuses an
          # unauthenticated runner once the shared address is over its
          # hourly limit (403). This curl adds the job's token to API calls
          # only; downloads and every other host go out unchanged.
          shim="$RUNNER_TEMP/curlshim"; mkdir -p "$shim"
          real=$(command -v curl)
          cat > "$shim/curl" <<SHIM
          #!/bin/sh
          for a in "\$@"; do
            case "\$a" in https://api.github.com/*) exec "$real" -H "Authorization: Bearer \$GH_API_TOKEN" "\$@";; esac
          done
          exec "$real" "\$@"
          SHIM
          chmod +x "$shim/curl"
          curl -fsSL https://get.w17.dev/install.sh | PATH="$shim:$PATH" sh -s -- "${sel[@]}" --dir "$HOME/bin"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Resolve the SDK version
        id: sdk
        if: inputs.sdk_ref != ''
        run: |
          # The version Go resolves the ref to (a tag, or a pseudo-version).
          v="$(docker run --rm -e GOFLAGS=-mod=mod golang:1.26 go list -m -f '{{.Version}}' "github.com/wandering-compiler/sdk/go@${{ inputs.sdk_ref }}")"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "SDK at $v"

      - name: Generate, build and test
        working-directory: examples/${{ matrix.example }}
        run: |
          set -euo pipefail
          # The plugins under review replace the vendored trees. Copied, not
          # `w17ctl plugin update`: that records the version in the lock,
          # and a lock edit is a person's (the console refuses it to a
          # machine account). Codegen builds from the tree it finds.
          if [ -n "${{ inputs.plugins_ref }}" ]; then
            for dir in proto/plugins/*/; do
              p="$(basename "$dir")"
              if [ -d "$GITHUB_WORKSPACE/plugins/$p" ]; then
                rsync -a --delete "$GITHUB_WORKSPACE/plugins/$p/" "$dir"
              fi
            done
          fi
          w17ctl codegen --force
          # The SDK under review, after codegen: codegen writes the lock's
          # SDK pin into every module, and `w17ctl sdk pin` is a lock edit
          # too. `go get` moves each module (and its go.sum) to the commit.
          if [ -n "${{ steps.sdk.outputs.version }}" ]; then
            find . -name go.mod -not -path '*/node_modules/*' -print0 \
              | xargs -0 grep -l 'wandering-compiler/sdk/go ' \
              | while IFS= read -r mod; do
                  docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp -e GOWORK=off \
                    -v "$PWD:/w" -w "/w/$(dirname "$mod")" golang:1.26 \
                    go get "github.com/wandering-compiler/sdk/go@${{ steps.sdk.outputs.version }}"
                done
            # A module that reaches the SDK through a local `replace` — a
            # hand-written worker on the vendored plugin tree or on srcgo — is
            # built on its own (GOWORK=off, in its image), and the move above
            # raises what it has to list (a newer genproto, say): its build
            # then stops at "updates to go.mod needed". Tidy those, as a
            # consumer does after an SDK bump, and show what changed. Only
            # those: a module without a local replace (srcgo) builds inside
            # the workspace and cannot be tidied on its own.
            find . -name go.mod -not -path '*/node_modules/*' -print0 \
              | { xargs -0 grep -lE '=> \.\.?/' || true; } \
              | while IFS= read -r mod; do
                  docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp -e GOWORK=off \
                    -v "$PWD:/w" -w "/w/$(dirname "$mod")" golang:1.26 \
                    go mod tidy
                done
            git diff --stat -- '*go.mod' || true
          fi
          w17ctl test
