# The adoption test: generate, build and run every example — with the SDK
# and the plugins at the versions given, or at the versions the examples pin.
#
# Called from the SDK and plugins repositories on their pull requests (with
# the pull request's commit), from this repository's own CI, and nightly
# against the main branches.
name: adoption

on:
  workflow_call:
    inputs:
      sdk_ref:
        description: SDK commit or tag to build against (empty = the version each example pins)
        type: string
        default: ""
      plugins_ref:
        description: plugins commit or tag to take every installed plugin from (empty = the released versions in each lock)
        type: string
        default: ""
      examples:
        description: space-separated example directories (empty = all)
        type: string
        default: ""
      w17ctl_version:
        description: w17ctl release to run (empty = the newest, prereleases included)
        type: string
        default: ''
    secrets:
      W17_TOKEN:
        description: API token of a machine account on the console
        required: true

permissions:
  contents: read

jobs:
  # Which examples to run: the `examples` input, or every directory with a
  # w17/lock.yaml.
  list:
    runs-on: ubuntu-latest
    outputs:
      examples: ${{ steps.list.outputs.examples }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: wandering-compiler/examples
          ref: ${{ github.repository == 'wandering-compiler/examples' && github.sha || 'main' }}
          path: examples

      - id: list
        working-directory: examples
        run: |
          set -euo pipefail
          list="${{ inputs.examples }}"
          if [ -z "$list" ]; then
            # `if`, not `[ -f … ] && echo`: the last directory without a lock
            # would end the loop non-zero and set -e would stop the step silently.
            for d in */; do
              if [ -f "$d/w17/lock.yaml" ]; then list="$list ${d%/}"; fi
            done
          fi
          [ -n "$list" ] || { echo "::error::no example (a directory with w17/lock.yaml) found"; exit 1; }
          # shellcheck disable=SC2086 # the list is space-separated on purpose
          json="$(printf '%s\n' $list | jq -R . | jq -cs .)"
          echo "examples=$json" >> "$GITHUB_OUTPUT"
          echo "examples: $json"

  # The Go modules every example job needs, downloaded once and shared through
  # the Actions cache. Without it each of the parallel jobs, and each container
  # inside one, fetched the same few hundred modules from proxy.golang.org and
  # sum.golang.org, and one dropped HTTP/2 stream among those thousands of
  # requests failed a job at random. The example jobs serve this cache to their
  # containers as a module proxy (see "Serve the module cache").
  modules:
    needs: list
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      sdk_version: ${{ steps.sdk.outputs.version }}
      cache_key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: wandering-compiler/examples
          ref: ${{ github.repository == 'wandering-compiler/examples' && github.sha || 'main' }}
          path: examples

      - name: Resolve the SDK version
        id: sdk
        if: inputs.sdk_ref != ''
        run: |
          # The version Go resolves the ref to (a tag, or a pseudo-version).
          v="$(docker run --rm -e GOFLAGS=-mod=mod -e GODEBUG=http2client=0 golang:1.26 go list -m -f '{{.Version}}' "github.com/wandering-compiler/sdk/go@${{ inputs.sdk_ref }}")"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "SDK at $v"

      - name: Cache key
        id: key
        run: |
          set -euo pipefail
          # The SDK the examples build against (the one under review, or the
          # ones the locks pin) and every committed go.sum.
          sdk="${{ steps.sdk.outputs.version }}"
          if [ -z "$sdk" ]; then
            sdk="$(grep -h '^sdk_version:' examples/*/w17/lock.yaml | awk '{print $2}' | sort -u | tr '\n' ' ')"
          fi
          sums="$(find examples -name go.sum -not -path '*/node_modules/*' -print0 | sort -z | xargs -0 cat | sha256sum | cut -c1-16)"
          echo "key=gomod-v1-$(echo "$sdk" | tr ' ' '_')-$sums" >> "$GITHUB_OUTPUT"
          echo "sdk=$sdk" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: restore
        with:
          path: ~/gomod
          key: ${{ steps.key.outputs.key }}
          restore-keys: gomod-v1-

      - name: Download the modules
        if: steps.restore.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$HOME/gomod"
          # go in a container, as the runner's user so the cache stays
          # readable to the save step; HTTP/1.1, where a dropped request is a
          # retryable error rather than a reset HTTP/2 stream.
          gorun() {
            docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp -e GOMODCACHE=/gomod \
              -e GODEBUG=http2client=0 -e GOFLAGS=-mod=mod -e GOWORK=off \
              -v "$HOME/gomod:/gomod" -v "$PWD:/w" -w "/w/$1" golang:1.26 sh -c "$2"
          }
          retry() { for i in 1 2 3; do "$@" && return 0; echo "::warning::attempt $i failed: $*"; sleep 10; done; return 1; }
          # The SDK's whole module graph, through a scratch module.
          mkdir -p warm
          for v in ${{ steps.key.outputs.sdk }}; do
            printf 'module warm\n\ngo 1.26.1\n' > warm/go.mod; rm -f warm/go.sum
            retry gorun warm "go get github.com/wandering-compiler/sdk/go@$v && go mod download all"
          done
          # What each committed module lists (srcgo, livetest/, workers), one
          # attempt each: a module whose local replace points into the
          # generated tree (w17/stubs) cannot be resolved before codegen, and
          # retrying it would only wait. Its modules come from the proxy like
          # any other miss.
          find examples -name go.mod -not -path '*/node_modules/*' -not -path '*/w17/services/*' -not -path '*/w17/stubs/*' \
            | while IFS= read -r mod; do
                gorun "$(dirname "$mod")" "go mod download" || echo "::notice::skipped $(dirname "$mod")"
              done
          du -sh "$HOME/gomod"

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.restore.outputs.cache-hit != 'true'
        with:
          path: ~/gomod
          key: ${{ steps.key.outputs.key }}

  # One job per example, in parallel: each example is its own project with its
  # own stack, so nothing is shared between them, and the slowest example sets
  # the run's length rather than the sum of all of them.
  example:
    needs: [list, modules]
    name: ${{ matrix.example }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        example: ${{ fromJSON(needs.list.outputs.examples) }}
    env:
      W17_TOKEN: ${{ secrets.W17_TOKEN }}
      # A runner's checkout has no branch, and `w17ctl test` syncs the schema
      # under the branch's initiative. One fixed name for every run, so CI does
      # not leave an initiative per branch on the console.
      W17_INITIATIVE: ci
      # Every go in a container speaks HTTP/1.1 to the module proxies: an
      # HTTP/2 stream the proxy resets ("stream error … INTERNAL_ERROR") is
      # not retried, a failed HTTP/1.1 request is.
      GODEBUG: http2client=0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: wandering-compiler/examples
          # This repository's own runs test the change under review; a call
          # from the SDK or the plugins tests the examples as they are.
          ref: ${{ github.repository == 'wandering-compiler/examples' && github.sha || 'main' }}
          path: examples

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: inputs.plugins_ref != ''
        with:
          repository: wandering-compiler/plugins
          ref: ${{ inputs.plugins_ref }}
          path: plugins

      - name: Install w17ctl
        env:
          GH_API_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$HOME/bin"
          v="${{ inputs.w17ctl_version }}"
          if [ -n "$v" ]; then sel=(--version "$v"); else sel=(--pre); fi
          # --pre lists releases through the GitHub API, which refuses an
          # unauthenticated runner once the shared address is over its
          # hourly limit (403). This curl adds the job's token to API calls
          # only; downloads and every other host go out unchanged.
          shim="$RUNNER_TEMP/curlshim"; mkdir -p "$shim"
          real=$(command -v curl)
          cat > "$shim/curl" <<SHIM
          #!/bin/sh
          for a in "\$@"; do
            case "\$a" in https://api.github.com/*) exec "$real" -H "Authorization: Bearer \$GH_API_TOKEN" "\$@";; esac
          done
          exec "$real" "\$@"
          SHIM
          chmod +x "$shim/curl"
          curl -fsSL https://get.w17.dev/install.sh | PATH="$shim:$PATH" sh -s -- "${sel[@]}" --dir "$HOME/bin"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/gomod
          key: ${{ needs.modules.outputs.cache_key }}

      # The restored cache's download tree has the layout of a GOPROXY, so a
      # static file server is one. Containers reach it at its address on the
      # default bridge (builds and `docker run` without --network use it; a
      # container on a stack's network is connected to it as well, see
      # livetest/run.sh). A module the cache lacks is a 404, and go goes on to
      # proxy.golang.org. Checksums still come from sum.golang.org: the cached
      # tiles do not cover a tree that has grown since, so the server does not
      # claim to serve the checksum database.
      - name: Serve the module cache
        run: |
          set -euo pipefail
          mkdir -p "$HOME/gomod/cache/download"
          docker run -d --name w17-goproxy -v "$HOME/gomod/cache/download:/www:ro" busybox:1.37 httpd -f -p 80 -h /www
          ip="$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' w17-goproxy)"
          echo "GOPROXY=http://$ip,https://proxy.golang.org,direct" >> "$GITHUB_ENV"
          echo "W17_GOPROXY_CONTAINER=w17-goproxy" >> "$GITHUB_ENV"
          echo "module cache served at http://$ip ($(du -sh "$HOME/gomod" | cut -f1))"

      - name: Generate, build and test
        working-directory: examples/${{ matrix.example }}
        run: |
          set -euo pipefail
          # The plugins under review replace the vendored trees. Copied, not
          # `w17ctl plugin update`: that records the version in the lock,
          # and a lock edit is a person's (the console refuses it to a
          # machine account). Codegen builds from the tree it finds.
          if [ -n "${{ inputs.plugins_ref }}" ]; then
            for dir in proto/plugins/*/; do
              p="$(basename "$dir")"
              if [ -d "$GITHUB_WORKSPACE/plugins/$p" ]; then
                rsync -a --delete "$GITHUB_WORKSPACE/plugins/$p/" "$dir"
              fi
            done
          fi
          # The SDK under review, BEFORE codegen as well: codegen pins every
          # generated module to the version the project's own modules require,
          # and refuses one older than the console's SDK floor. Left at the
          # example's release, an SDK pull request was refused before its SDK
          # was ever applied whenever the console had moved past that release
          # (every SDK PR on 2026-10-14). `go mod edit` rewrites the require
          # line alone — no lock edit (refused to a machine account), and no
          # resolution, which a module whose replace points into the not yet
          # generated tree could not do. go.sum follows with `go get` below.
          # Only srcgo, the module codegen reads the version from: a module
          # whose require is raised here without resolution keeps the old
          # requirements of everything else (genproto, say), and the `go get`
          # below then finds the SDK already at that version and resolves
          # nothing for it — its build stops at "missing go.sum entry".
          if [ -n "${{ needs.modules.outputs.sdk_version }}" ] && [ -f srcgo/go.mod ] \
            && grep -q 'wandering-compiler/sdk/go ' srcgo/go.mod; then
            docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp -e GOWORK=off -e GOFLAGS=-mod=mod \
              -v "$PWD:/w" -w /w/srcgo golang:1.26 \
              go mod edit -require="github.com/wandering-compiler/sdk/go@${{ needs.modules.outputs.sdk_version }}"
          fi
          # The console queues at most a few codegen runs per organization,
          # and the sdk, plugins and examples CI share one, so a busy moment
          # refuses the run with ORG_PLACEMENT_LIMIT. That refusal, and only
          # that one, is waited out; any other failure fails the job at once.
          for wait in 30 60 120 120 0; do
            if w17ctl codegen --force 2>&1 | tee codegen.log; then
              break
            fi
            if [ "$wait" = 0 ] || ! grep -q ORG_PLACEMENT_LIMIT codegen.log; then
              exit 1
            fi
            echo "::notice::the console's codegen queue for this organization is full; retrying in ${wait}s"
            sleep "$wait"
          done
          rm -f codegen.log
          # The SDK under review, after codegen too: `go get` moves every
          # module — the generated ones included — and its go.sum to the
          # commit (`w17ctl sdk pin` would be a lock edit).
          retry() { for i in 1 2 3; do "$@" && return 0; echo "::warning::attempt $i failed: $*"; sleep 10; done; return 1; }
          if [ -n "${{ needs.modules.outputs.sdk_version }}" ]; then
            find . -name go.mod -not -path '*/node_modules/*' -print0 \
              | xargs -0 grep -l 'wandering-compiler/sdk/go ' \
              | while IFS= read -r mod; do
                  retry docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp -e GOWORK=off -e GOPROXY -e GODEBUG \
                    -v "$PWD:/w" -w "/w/$(dirname "$mod")" golang:1.26 \
                    go get "github.com/wandering-compiler/sdk/go@${{ needs.modules.outputs.sdk_version }}"
                done
            # A module that reaches the SDK through a local `replace` — a
            # hand-written worker on the vendored plugin tree or on srcgo — is
            # built on its own (GOWORK=off, in its image), and the move above
            # raises what it has to list (a newer genproto, say): its build
            # then stops at "updates to go.mod needed". Tidy those, as a
            # consumer does after an SDK bump, and show what changed. Only
            # those: a module without a local replace (srcgo) builds inside
            # the workspace and cannot be tidied on its own.
            find . -name go.mod -not -path '*/node_modules/*' -print0 \
              | { xargs -0 grep -lE '=> \.\.?/' || true; } \
              | while IFS= read -r mod; do
                  retry docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp -e GOWORK=off -e GOPROXY -e GODEBUG \
                    -v "$PWD:/w" -w "/w/$(dirname "$mod")" golang:1.26 \
                    go mod tidy
                done
            git diff --stat -- '*go.mod' || true
          fi
          # An example with a live suite runs it: run.sh brings the stack up
          # with the generated suite (`w17ctl test --keep`), runs livetest/
          # inside the stack's network, and tears the stack down. One stack
          # for both, so the generated suite is not run twice.
          if [ -x livetest/run.sh ]; then
            livetest/run.sh
          else
            w17ctl test
          fi
