name: ci

on:
  # A change to Markdown alone generates, builds and tests nothing, so it runs
  # nothing; the nightly run still covers main. Comments in protos and code
  # are not Markdown and still run everything.
  push:
    branches: [main, next]
    paths-ignore: ["**/*.md"]
  pull_request:
    paths-ignore: ["**/*.md"]
  schedule:
    - cron: "17 3 * * *"   # nightly, against the main branches of the SDK and the plugins
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Every Go image, go.mod / go.work line and setup-go version names
  # go.version's line; scripts/go-bump.sh <line> moves them all.
  go-version:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/check-go-version.sh

  # Not on next (the coming minor): its examples use what the hosted compiler
  # only learns when that minor is deployed, so generating them here would
  # fail for a reason that is not theirs. They are generated and run against
  # the next compiler before it is released; a fix merged forward from main
  # was proven there already.
  released:
    if: github.event_name != 'schedule' && github.base_ref != 'next' && github.ref_name != 'next'
    uses: ./.github/workflows/adoption.yml
    secrets: inherit

  # Also on a manual run, to try the main branches without waiting for night.
  nightly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/adoption.yml
    with:
      sdk_ref: main
      plugins_ref: main
    secrets: inherit
