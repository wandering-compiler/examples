name: ci

on:
  # A change to Markdown alone generates, builds and tests nothing, so it runs
  # nothing; the nightly run still covers main. Comments in protos and code
  # are not Markdown and still run everything.
  push:
    branches: [main]
    paths-ignore: ["**/*.md"]
  pull_request:
    paths-ignore: ["**/*.md"]
  schedule:
    - cron: "17 3 * * *"   # nightly, against the main branches of the SDK and the plugins
  workflow_dispatch:

permissions:
  contents: read

jobs:
  released:
    if: github.event_name != 'schedule'
    uses: ./.github/workflows/adoption.yml
    secrets: inherit

  # Also on a manual run, to try the main branches without waiting for night.
  nightly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/adoption.yml
    with:
      sdk_ref: main
      plugins_ref: main
    secrets: inherit
