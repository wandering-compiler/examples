syntax = "proto3";

package single_binary.app.example;

import "w17/event.proto";
import "w17/field.proto";
import "domains/app/example/events/events.proto";
import "domains/app/example/types/models.proto";

message CreateNoteCheckedReq {
  string owner_id = 1 [(w17.field) = { type: UUID }];
  string title    = 2 [(w17.field) = { type: CHAR, min_len: 1, max_len: 200 }];
  string body     = 3 [(w17.field) = { type: TEXT }];
}

message ReadAttachmentReq { int64 note_id = 1; }

// ReadAttachmentResp — what the facade learned by actually READING the
// uploaded file: its size in bytes and its first line. Both are
// properties of the CONTENT, so neither can be produced from the row
// alone — an assertion on them fails unless the business tier really
// opened the object.
message ReadAttachmentResp {
  int64  byte_count = 1;
  string first_line = 2;
}

message ExportNoteReq { int64 note_id = 1; }

message NoteTextReq { int64 note_id = 1; }

// NoteTextResp — a note rendered as a text file, answered as the HTTP body
// (rest.proto's `raw_response`): `body` IS the response, `mime` its
// Content-Type and `file_name` the name the browser saves it under.
message NoteTextResp {
  bytes  body      = 1;
  string mime      = 2;
  string file_name = 3;
}

message QuoteReq { string id = 1; }

// QuoteResp — a quote as the third-party Quotes API answered it, through the
// egress client proto/clients/quotes.
message QuoteResp {
  string id     = 1;
  string text   = 2;
  string author = 3;
}

// NotesFacade — hand-written BUSINESS tier. CreateNoteChecked applies a
// trivial business rule (tags the title) then delegates to the storage
// NoteMutation. In the single binary the facade reaches storage by
// DIRECT in-process call (no network). Lives under business/ so the
// codegen discovers it as a facade service (no (w17.db.method) — the body
// is hand-written, registered via the project's RegisterBusiness).
service NotesFacade {
  // The emit lives HERE, on the facade, because "a note passed the check"
  // is a fact this method owns — the storage CreateNote it delegates to
  // cannot tell a checked write from a direct one. The wrapper that fires
  // it is installed by this bundle's registry at Register…Server, so the
  // event goes out for every caller of the facade: the REST gateway, an
  // in-process call in the composed binary, a bus delivery.
  rpc CreateNoteChecked(CreateNoteCheckedReq) returns (Note) {
    option (w17.event_emit) = {
      event: "NoteChecked"
      payload: {
        fields: [
          { key: "note_id", value: "$response.id" },
          { key: "title",   value: "$response.title" }
        ]
      }
    };
  }

  // ReadAttachment — the business tier reading a file the GATEWAY
  // wrote. It resolves the note's storage handle over the storage
  // client, then opens the object through the injected read-only store
  // (`clients.AppUploadsStore()`), which the bundle built from the same
  // bucket root the gateway writes into.
  //
  // This is the shape the UPLOADED_FILE docs promise ("business code
  // reads files back through the same handle") and the one an import
  // pipeline needs: the gateway owns the bytes landing safely, the
  // facade owns what they MEAN.
  rpc ReadAttachment(ReadAttachmentReq) returns (ReadAttachmentResp);

  // ExportNote — the business tier MAKING a file and storing it: it renders
  // the note as text, puts it through the writable store the bundle built
  // for `app-exports` (`clients.AppExportsStore()`, keyed by
  // `NoteExportFilePlacement`), and records the handle. The REST answer
  // carries the download URL the gateway rewrote the handle into.
  rpc ExportNote(ExportNoteReq) returns (NoteExport);

  // NoteText — the same file, rendered per request and never stored: the
  // response's bytes are the HTTP body (rest.proto's `raw_response`).
  rpc NoteText(NoteTextReq) returns (NoteTextResp);

  // CreateNoteCheckedComposed — COMPOSITION: no annotation of its own; it
  // reuses CreateNoteChecked through the server the registry returned, so
  // CreateNoteChecked's declared NoteChecked still fires. A direct Go call on
  // the implementation would skip the emit wrapper and publish nothing.
  rpc CreateNoteCheckedComposed(CreateNoteCheckedReq) returns (Note);

  // CreateNoteCheckedInTx — the same composition inside the caller's own
  // distx transaction. NoteChecked waits for that transaction's COMMIT and is
  // dropped if it rolls back; a title starting with "rollback:" makes this
  // method fail after the composed call, so the live suite can see both.
  rpc CreateNoteCheckedInTx(CreateNoteCheckedReq) returns (Note);

  // Quote — the business tier calling a third-party REST API through a
  // generated egress client (proto/clients/quotes): `egress.Quotes()` is a
  // gRPC client served in-process by this bundle, each call an HTTP request
  // with the credential from W17_CLIENT_QUOTES_DSN, retried when the API is
  // briefly unavailable, its errors coded for this caller.
  rpc Quote(QuoteReq) returns (QuoteResp);
}
