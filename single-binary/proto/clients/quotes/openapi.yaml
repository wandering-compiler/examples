# The contract of the third-party API this example calls — a stand-in,
# served by the stub in this directory. `w17ctl client generate` turned it
# into the egress client under proto/clients/quotes/ (which vendors a copy).
openapi: 3.0.3
info:
  title: Quotes
  version: "1"
servers:
  - url: https://quotes.example
security:
  - bearer: []
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
  schemas:
    Quote:
      type: object
      required: [id, text]
      properties:
        id: { type: string }
        text: { type: string }
        author: { type: string }
paths:
  /quotes/{id}:
    get:
      operationId: getQuote
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The quote.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Quote" }
        "404":
          description: No such quote.
