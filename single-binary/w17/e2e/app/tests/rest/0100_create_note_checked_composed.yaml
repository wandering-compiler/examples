# Edit, then REGENERATE before running: the suite executes the BAKED
# copy of this file (scenarios_gen_test.go), not the file itself.
# `w17ctl codegen` && `w17ctl test` — skip the regen and the run
# silently asserts the previous expectations and passes.
# CreateNoteCheckedComposed / CreateNoteCheckedInTx reuse CreateNoteChecked
# through the served server. The "[checked] " prefix on the title is written by CreateNoteChecked
# alone, so it proves the composed call reached it. (That the composed call
# also published NoteChecked is proven live in composedtest: the subscriber's
# "[stamped] " title.)
method: example.NotesFacade.CreateNoteCheckedComposed
input:
    owner_id: ${random:uuid}
    title: e2e-value
    body: e2e-value
expect:
    id: {matcher: not_empty}
    owner_id: {matcher: not_empty}
    title: {matcher: eq, value: "[checked] e2e-value"}
    body: {matcher: not_empty}
    created_at: {matcher: not_empty}
