syntax = "proto3";

package rpc_cli.ops.jobs;

import "google/protobuf/timestamp.proto";
import "w17/db.proto";
import "w17/field.proto";

enum JobStatus {
  JOB_STATUS_UNSPECIFIED = 0;
  JOB_STATUS_QUEUED      = 1;
  JOB_STATUS_RUNNING     = 2;
  JOB_STATUS_DONE        = 3;
  JOB_STATUS_CANCELLED   = 4;
}

// Job — an ordinary model. Nothing about it is special; it exists so the
// rpc and cli surfaces have real methods to expose, and so a CLI command
// has a request with both a positional-bindable field and flag-bindable
// ones.
message Job {
  option (w17.db.table) = { name: "jobs" };

  int64 id = 1 [(w17.field) = { pk: true, default_auto: IDENTITY }];

  string name = 2 [(w17.field) = { type: CHAR, min_len: 1, max_len: 120 }];

  JobStatus status = 3 [(w17.field) = { default_int: 1 }];

  int32 priority = 4 [(w17.field) = { type: NUMBER, gte: 0, lte: 9, default_int: 5 }];

  google.protobuf.Timestamp created_at = 5 [(w17.field) = { default_auto: NOW, immutable: true }];
}
