# What this example adds to the generated stack (compose.w17.yaml), merged
# over it by the include in compose.yaml: the seed rows the suite starts
# from.
services:
  # One-shot: applies the rendered seed of fixtures/catalog/test.json
  # (rendered into w17/fixtures by `w17ctl fixtures render`) with the
  # storage binary itself; the binary refuses a seed older than its
  # fixture. The schema is in place by then: `w17ctl test` builds it
  # before the services start.
  catalog-seed:
    build:
      context: .
      dockerfile: w17/services/catalog-storage/Dockerfile
    environment:
      # The database a `fixtures apply` seeds is the connection's target.
      W17_TARGET_CATALOG_POSTGRES: postgres://catalog:${W17_CATALOG_POSTGRES_DB_PASSWORD:-catalog}@catalog-postgres:5432/catalog?sslmode=disable
    command: ["fixtures", "apply", "--connection", "catalog-postgres", "--fixtures", "/w17/fixtures"]
    restart: "no"
    volumes:
      - ./w17/fixtures:/w17/fixtures:ro
      - ./fixtures/catalog/test.json:/fixtures/catalog/test.json:ro
    depends_on:
      catalog-postgres: { condition: service_healthy }

  catalog-storage:
    depends_on:
      catalog-seed: { condition: service_completed_successfully }
