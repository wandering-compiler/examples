# Generated by w17 codegen — compose.w17.yaml. DO NOT EDIT.
#
# Tool-owned canonical project compose. Developers override
# or extend in the sibling compose.yaml stub (which include:s
# this file). Edits made here may be overwritten by future
# 'w17 generate' runs; put customisations in compose.yaml
# instead.
#
# Composition layers:
#   - services:  per-connection infrastructure (this file)
#   - include:   per-bundle binaries pulled in (this file)
#   - compose.yaml: developer overrides
#
# Run from the project root:
#
#   docker compose up -d

name: w17-examples-databases

services:
  catalog-postgres:
    image: w17-postgis-pgvector:18-3.6
    # No published image carries every extension this schema needs, so the
    # stack builds one (see the generator's postgresImage).
    build:
      dockerfile_inline: |
        FROM postgis/postgis:18-3.6
        RUN apt-get update \
            && apt-get install -y --no-install-recommends postgresql-18-pgvector \
            && rm -rf /var/lib/apt/lists/*
    environment:
      POSTGRES_USER: catalog
      POSTGRES_PASSWORD: ${W17_CATALOG_POSTGRES_DB_PASSWORD:-catalog}
      POSTGRES_DB: catalog
    ports:
      - "${W17_BIND_HOST:-0.0.0.0}:${W17_CATALOG_POSTGRES_HOST_PORT:-14000}:5432"
    volumes:
      # PG-18+ stores data in /var/lib/postgresql/<major>/ so
      # the mount must be the parent dir.
      - catalog-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalog -d catalog"]
      interval: 1s
      timeout: 3s
      retries: 30
  dialects-mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${W17_DIALECTS_MYSQL_DB_PASSWORD:-dialects}
      MYSQL_DATABASE: dialects
      MYSQL_USER: dialects
      MYSQL_PASSWORD: ${W17_DIALECTS_MYSQL_DB_PASSWORD:-dialects}
    ports:
      - "${W17_BIND_HOST:-0.0.0.0}:${W17_DIALECTS_MYSQL_HOST_PORT:-14001}:3306"
    volumes:
      - dialects-mysql-data:/var/lib/mysql
    healthcheck:
      # Read the password from the container env (MYSQL_PWD) instead of a
      # -p flag so it isn't visible in docker inspect / process listings.
      # $$ escapes compose interpolation to shell $MYSQL_PASSWORD.
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysqladmin ping -h 127.0.0.1 -udialects --silent"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Eventbus broker — JetStream-enabled NATS for every channel
  # declared with TRANSPORT_NATS in this project's protos.
  nats:
    image: nats:2.14-alpine
    # The -sd flag is what makes the volume below mean anything. Without it
    # JetStream stores under /tmp/nats/jetstream INSIDE the container — the
    # volume mounts, nothing writes to it, and every "docker compose up -d"
    # that recreates this container destroys every stream, every consumer and
    # every unacked message.
    #
    # That failure is silent from the outside: a subscriber reconnects at the
    # TCP level to a server that no longer has its consumer, and stops
    # delivering without logging anything: a sign-in returns 200, its
    # challenge row appears, and the code it emits never arrives.
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "${W17_BIND_HOST:-0.0.0.0}:${W17_NATS_CLIENT_HOST_PORT:-14002}:4222"
      - "${W17_BIND_HOST:-0.0.0.0}:${W17_NATS_MONITOR_HOST_PORT:-14003}:8222"
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8222/healthz || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Distributed tracing backend — Jaeger all-in-one. Default-on:
  # every bundle ships W17_OTEL_ENDPOINT=w17-tracing:4317 in its
  # .env.defaults, so OTLP/gRPC spans land here and you can open
  # the UI to confirm the whole request path is traced.
  #
  #   UI:   http://localhost:16686
  #   OTLP: w17-tracing:4317 (in-network only — bundles dial it
  #         over the compose network; not host-published)
  #
  # Free for local dev (Apache-2.0, self-hosted image). Turn it
  # OFF without editing this tool-owned file — in the sibling
  # compose.yaml add:
  #   services:
  #     w17-tracing:
  #       profiles: ["no-tracing"]   # profile-scoped → skipped on a plain `up`
  # and clear W17_OTEL_ENDPOINT in the affected bundles' .env.
  w17-tracing:
    image: jaegertracing/all-in-one:1.76.0
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "${W17_BIND_HOST:-0.0.0.0}:${W17_TRACING_UI_HOST_PORT:-16686}:16686"
    # OTLP ingest is internal-only: bundles reach it at
    # w17-tracing:4317 over the compose network, so it
    # is exposed to siblings but never host-published.
    expose:
      - "4317"

volumes:
  catalog-postgres-data:
  dialects-mysql-data:
  nats-data:

# Bundle binaries join via Docker Compose `include`.
# Each per-bundle compose.yaml declares JUST the binary;
# infrastructure (DBs, queue) lives above.
include:
  - w17/services/catalog-gateway/compose.yaml
  - w17/services/catalog-storage/compose.yaml
  - w17/services/dialects-storage/compose.yaml
