[package]
# The register's last segment (w17/lock.yaml: register: business/notes): the
# package and its binary share the name, and the image builds `--bin notes`.
name = "notes"
version = "0.1.0"
edition = "2024"
publish = false
description = "The notes domain's business tier, on the Rust business SDK (w17-business)."

# Standalone: never captured by a workspace above it.
[workspace]

[dependencies]
# Both SDK crates at the tag of the project's sdk_version (w17/lock.yaml). The
# image checks that Cargo.lock takes them from this tag.
w17-business = { git = "https://github.com/wandering-compiler/sdk", tag = "rs/v0.1.0-rc.69" }
# The code w17-business-build generates names tonic and prost by path: the
# majors the SDK is built on.
tonic = "0.14"
prost = "0.14"
tokio = { version = "1", features = ["macros"] }

[build-dependencies]
w17-business-build = { git = "https://github.com/wandering-compiler/sdk", tag = "rs/v0.1.0-rc.69" }
