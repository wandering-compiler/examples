syntax = "proto3";

package business_rs.notes.board;

import "w17/event.proto";
import "w17/field.proto";
import "w17/paging.proto";
import "domains/notes/board/events/events.proto";
import "domains/notes/board/types/models.proto";

message WriteNoteReq {
  string batch = 1 [(w17.field) = { type: CHAR, min_len: 1, max_len: 64 }];
  string title = 2 [(w17.field) = { type: CHAR, min_len: 1, max_len: 200 }];
  string body  = 3 [(w17.field) = { type: TEXT }];
}

message BrowseNotesReq { string batch = 1; }

message BrowseNotesResp {
  repeated Note items  = 1;
  w17.Paging    paging = 2;
}

message ExportNoteReq { int64 note_id = 1; }

message QuoteReq { string id = 1; }

// QuoteResp — a quote as the third-party Quotes API answered it, through the
// egress client proto/clients/quotes.
message QuoteResp {
  string id     = 1;
  string text   = 2;
  string author = 3;
}

// NotesService — the business tier, written in Rust
// (business/notes/w17.ts). No `(w17.db.method)` anywhere: every body is
// hand-written, and the Rust business SDK serves the service from the
// descriptor set codegen writes.
service NotesService {
  // CreateNote — writes the note through the storage mutation. The emit is
  // declared here, so the SDK publishes NoteCreated after the method
  // returns: at once outside a transaction, after the commit inside one.
  rpc CreateNote(WriteNoteReq) returns (Note) {
    option (w17.event_emit) = {
      event: "NoteCreated"
      payload: {
        fields: [
          { key: "note_id", value: "$response.id" },
          { key: "batch",   value: "$request.batch" },
          { key: "title",   value: "$response.title" }
        ]
      }
    };
  }

  // CreateNoteInTx — CreateNote composed inside a distributed transaction
  // (distx.run), through the served service (registry.self), so its
  // NoteCreated waits for the commit. A title that starts with "rollback:"
  // makes the method fail after the write: the transaction rolls back, the
  // note is never stored and the event is never published. On commit, an
  // onCommit hook records a `committed` mark for the note.
  rpc CreateNoteInTx(WriteNoteReq) returns (Note);

  // ListNotes — one page of a batch: the business tier calls the storage
  // query with paging.forward(ctx) and copies its w17.Paging into the
  // answer.
  rpc ListNotes(BrowseNotesReq) returns (BrowseNotesResp);

  // ExportNote — the business tier MAKING a file and storing it: it renders
  // the note as text, puts it on notes-exports through the business
  // companion (`clients.store("notes-exports")`, the placement of
  // NoteExport.file) and records the handle through the storage mutation.
  // The REST answer carries the download URL the gateway rewrote the handle
  // into.
  rpc ExportNote(ExportNoteReq) returns (NoteExport);

  // Quote — the business tier calling a third-party REST API through the
  // generated egress client proto/clients/quotes: `clients.egress("quotes")`
  // is the client's own gRPC service, served by the business companion, which
  // makes the HTTP request with the credential from W17_CLIENT_QUOTES_DSN and
  // codes the API's errors for this caller (its 404 is NOT_FOUND).
  rpc Quote(QuoteReq) returns (QuoteResp);
}

// HandlerAck — what the eventbus handler answers: the note it marked, which
// its own emit (NoteDelivered) reads.
message HandlerAck {
  int64 note_id = 1;
}

// NotesEvents — the subscriber's handler, in the same Rust tier. The
// generated eventbus runner (Go) delivers NoteCreated to it over gRPC.
service NotesEvents {
  // OnNoteCreated — records a `delivered` mark for the note, then (its
  // emit) publishes NoteDelivered.
  rpc OnNoteCreated(NoteCreated) returns (HandlerAck) {
    option (w17.event_emit) = {
      event: "NoteDelivered"
      payload: {
        fields: [
          { key: "note_id", value: "$response.note_id" }
        ]
      }
    };
  }
}
