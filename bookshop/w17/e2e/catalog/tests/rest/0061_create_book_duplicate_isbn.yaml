# The ISBN is unique: the same one twice is refused. Like every
# validation-class refusal it arrives as INVALID_ARGUMENT, and the detail
# says which rule — the field and UNIQUE_VIOLATION.
method: books.BookMutation.CreateBook
pre: [fixtures/an_author.yaml]
input:
    author_id: ${author.id}
    title: Another edition
    isbn: "9780441478125"
    price_cents: "999"
expect_error:
    code: INVALID_ARGUMENT
    details:
        - field: isbn
          code: UNIQUE_VIOLATION
