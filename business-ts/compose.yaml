# Local developer compose. Pulled in by `docker compose up`
# by default (this file's filename is the Docker Compose
# discovery default).
#
# This is YOUR file — edit freely. Add custom services, override
# port mappings, swap images, attach debug containers. The tool
# created this file ONCE during `w17ctl codegen`; it never
# overwrites or regenerates it.
#
# The project's canonical service set lives in
# `compose.w17.yaml` (tool-owned, regenerated on every codegen
# run). This file `include:`s it via the live link below — when
# the tool updates the canonical set, your stack picks up the
# changes on the next `docker compose up`.

include:
  - compose.w17.yaml

# What this example adds to the generated stack: the third-party API the
# egress client calls. (The one store of notes-exports is the generated
# composes': the companion writes it, the gateway reads it back for the
# download route, and both mount the volume notes-uploads-notes-exports.)
services:
  # The business companion serves the TypeScript tier's egress clients and file
  # stores. Its egress client proto/clients/quotes calls the stand-in below:
  # the base URL and the credential, one secret (a real deployment resolves
  # it through the secret chain, never from a compose file).
  notes-business-companion:
    environment:
      W17_CLIENT_QUOTES_DSN: http://quotestub:8080?auth=bearer&token=test-token
    depends_on:
      quotestub: { condition: service_started }

  # The third-party Quotes API, stood in for by quotestub/ (its openapi.yaml
  # is what the client was generated from).
  quotestub:
    build: { context: quotestub, args: [GOPROXY, GOSUMDB, GODEBUG] }
