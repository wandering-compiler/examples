syntax = "proto3";

package e2e.app.users;

import "w17/db.proto";
import "w17/field.proto";
import "domains/app/workspace/users/types/models.proto";

message CreateUserReq {
  string email         = 1;
  string display_name  = 2;
  // Already-hashed password. Storage stores the value
  // verbatim into the PASSWORD-typed `User.password_hash`
  // column; the project's business layer (or whichever
  // service fronts UserMutation) computes the hash via
  // `passwordhash.Settings.Hash` before calling.
  string password_hash = 3 [(w17.field) = { type: PASSWORD }];
  // Optional; empty = NULL (the value form of a nullable CRYPTED_SECRET).
  string recovery_hint = 4 [(w17.field) = { null: true }];
}
message CreateUserResp {
  int64 id = 1;
}

message UpdateProfileReq {
  int64  user_id      = 1;
  string display_name = 2;
}
// Sets or clears the recovery hint. Unset = NULL (the presence form of a
// nullable CRYPTED_SECRET).
message SetRecoveryHintReq {
  int64           user_id       = 1;
  optional string recovery_hint = 2;
}
message SetRecoveryHintResp {}

message UpdateProfileResp {
  int64  id           = 1;
  string display_name = 2;
}

// UserMutation — write side of the accounts domain.
//
// CreateUser is a pure INSERT (no read-side; the lock list is
// empty so no FOR UPDATE suffix gets added).
//
// UpdateProfile loads the row, then UPDATEs it under
// SELECT FOR UPDATE — the per-statement lock filter
// applies the FOR UPDATE only to SELECTs whose FROM is `User`.
service UserMutation {
  rpc CreateUser(CreateUserReq) returns (CreateUserResp) {
    option (w17.db.method) = {
      ops: {
        name: "main",
        dql:  "INSERT INTO users.User SET email = :email, display_name = :display_name, password_hash = :password_hash, recovery_hint = :recovery_hint, status = 1 RETURNING id"
      }
    };
  }

  rpc SetRecoveryHint(SetRecoveryHintReq) returns (SetRecoveryHintResp) {
    option (w17.db.method) = {
      ops: {
        name: "main",
        dql:  "UPDATE users.User SET recovery_hint = :recovery_hint WHERE id = :user_id"
      }
    };
  }

  rpc UpdateProfile(UpdateProfileReq) returns (UpdateProfileResp) {
    option (w17.db.method) = {
      ops: {
        name: "load",
        dql:  "SELECT u.id FROM users.User u WHERE u.id = :user_id"
      }
      ops: {
        name: "save",
        dql:  "UPDATE users.User SET display_name = :display_name WHERE id = :user_id RETURNING id, display_name"
      }
    };
    option (w17.db.lock) = {
      locks: [
        { resource: "User", kind: SELECT_FOR_UPDATE }
      ]
    };
  }
}
