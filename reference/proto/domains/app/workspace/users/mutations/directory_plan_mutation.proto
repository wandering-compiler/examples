syntax = "proto3";

package e2e.app.users;

import "w17/client.proto";
import "w17/db.proto";
import "w17/event.proto";
import "w17/field.proto";
import "domains/app/workspace/users/events/events.proto";
import "domains/app/workspace/users/types/models.proto";

// CreateDirectoryPlanReq names every column a caller may set.
//
// The value rules live on the MODEL, not here — the request repeats no
// `(w17.field)` because the constraint is a property of the column and
// the storage codegen validates the INSERT against it. What the request
// message decides is only WHICH columns a caller may name.
message CreateDirectoryPlanReq {
  int64  user_id           = 1;
  string tier              = 2;
  string invoice_reference = 3;
  string monthly_fee       = 4;
  string placement         = 5;
}
message CreateDirectoryPlanResp {
  int64 id = 1;
}

message UpgradeDirectoryPlanReq {
  int64  id   = 1;
  string tier = 2;
}
message UpgradeDirectoryPlanResp {
  int64  id   = 1;
  string tier = 2;
}

message RetireDirectoryPlanReq {
  int64 id = 1;
}
message RetireDirectoryPlanResp {
  int64 id = 1;
}

// The WHOLE-MESSAGE spelling of a write: the caller sends the payload as
// one submessage and the DQL names no columns at all.
//
// It is here because the value rules that travel from the COLUMN to the
// REQUEST had never met this shape. The DECIMAL scale on `monthly_fee` is
// the one rule no DDL can carry — PostgreSQL coerces to the column type
// before any CHECK runs — so the request is where it has to hold, and at one
// point it held only for `SET col = :param`. Written this
// way, the same column, the same declaration and the same caller value went
// through unchecked and were silently rounded.
//
// The payload is the MODEL message: `SET :plan` needs a message-typed path,
// and expand drops what an update may not write (the primary key, immutable
// columns) rather than the author listing them.
message ReplaceDirectoryPlanReq {
  int64             id   = 1;
  UserDirectoryPlan plan = 2;
}
message ReplaceDirectoryPlanResp {
  int64 id = 1;
}

// DirectoryPlanMutation — the write side of the paid placement.
service DirectoryPlanMutation {
  // Buy a placement for an account's directory card.
  //
  // Refused when the tier is not one of the declared ones, the invoice
  // reference does not match the declared pattern, or the fee carries
  // more digits than the column may hold.
  rpc CreateDirectoryPlan(CreateDirectoryPlanReq) returns (CreateDirectoryPlanResp) {
    // `(w17.touches_entities)` — the FE cache-invalidation half of
    // touched-entity tracking, and the one that was never generated by anything.
    //
    // Without it, a successful mutation makes the generated client drop
    // its WHOLE cache (`invalidateAll`, the fallback behaviour): every list,
    // every unrelated detail read, refetched because one plan was
    // bought. With it the client drops only the entries tagged with
    // this entity type — which is the entire point of the annotation,
    // and is visible in the emitted client as a different call.
    //
    // The name resolves as an unqualified message in this RPC's proto
    // package; `DirectoryPlanSummary` is where the matching
    // `(w17.entity_id)` marker lives (see directory_plan_query.proto).
    option (w17.touches_entities) = "DirectoryPlanSummary";

    // SERVER-tier emit. A plan becoming live is a FACT about the row,
    // so it must fire on every path that reaches this handler — an
    // external POST, a business-tier call, a subscriber loopback. That
    // is the difference from the gateway emit on UpgradeDirectoryPlan
    // below, and it is the whole reason the vocabulary has two.
    option (w17.event_emit) = {
      event: "DirectoryPlanPublished"
      payload: {
        fields: [
          { key: "plan_id", value: "$response.id" },
          { key: "tier",    value: "$request.tier" }
        ]
      }
    };

    option (w17.db.method) = {
      ops: {
        name: "main",
        dql:
          "INSERT INTO users.UserDirectoryPlan "
          "SET user_id = :user_id, tier = :tier, "
          "invoice_reference = :invoice_reference, "
          "monthly_fee = :monthly_fee, placement = :placement "
          "RETURNING id"
      }
    };
  }

  // Move a placement to a different tier.
  rpc UpgradeDirectoryPlan(UpgradeDirectoryPlanReq) returns (UpgradeDirectoryPlanResp) {
    // Same entity family as the create: an upgrade changes the tier a
    // cached plan carries, so every entry tagged with it is stale.
    // Declared on EVERY mutation of this model rather than on the one
    // that happened to need it first — a mutation without it silently
    // falls back to dropping the whole cache, which is correct and
    // ruinous.
    option (w17.touches_entities) = "DirectoryPlanSummary";

    // `(w17.event_emit_gateway)` — the GATEWAY emit tier, and the one
    // annotation in this vocabulary that nothing had ever generated.
    //
    // Same `EmitConfig` body as `(w17.event_emit)`, a completely
    // different firing rule: the emit is generated in the REST / MCP
    // gateway, right after the business call returns success, so it
    // fires ONLY for requests that entered through a gateway. A nested
    // call or a subscriber loopback reaching this same handler produces
    // NO event.
    //
    // That is what the event means here. "Upgraded" is a customer
    // INTENT — it drives a confirmation screen and an in-app message —
    // and a background job that rewrote the tier for an unrelated
    // reason must not send one. An event_emit on this method would send
    // one every time, and the difference would show up as customers
    // being congratulated on upgrades they did not buy.
    //
    // An event has exactly ONE emit site, so this method's server-tier
    // sibling deliberately does not exist.
    option (w17.event_emit_gateway) = {
      event: "DirectoryPlanUpgraded"
      payload: {
        fields: [
          { key: "plan_id", value: "$response.id" },
          { key: "tier",    value: "$response.tier" }
        ]
      }
    };

    option (w17.db.method) = {
      ops: {
        name: "main",
        dql:
          "UPDATE users.UserDirectoryPlan SET tier = :tier "
          "WHERE id = :id RETURNING id, tier"
      }
    };
  }

  // Stop a placement from rendering.
  //
  // Server-tier emit, like the create: retirement is a fact about the
  // row, and a job that retires a batch of expired placements has to
  // produce the same signal a customer-initiated one does.
  rpc RetireDirectoryPlan(RetireDirectoryPlanReq) returns (RetireDirectoryPlanResp) {
    option (w17.touches_entities) = "DirectoryPlanSummary";

    option (w17.event_emit) = {
      event: "DirectoryPlanRetired"
      payload: {
        fields: [
          { key: "plan_id", value: "$response.id" }
        ]
      }
    };

    option (w17.db.method) = {
      ops: {
        name: "main",
        dql:
          "UPDATE users.UserDirectoryPlan SET tier = 'BASIC' "
          "WHERE id = :id RETURNING id"
      }
    };
  }

  // Overwrite a placement from a whole payload.
  //
  // The counterpart of CreateDirectoryPlan's column-by-column SET, and the
  // reason it exists is the inherited value rules: this is the shape whose
  // caller input reaches the columns one message deep. e2e 0518 sends a fee
  // with three decimals through it and requires the same refusal 0519 gets
  // from the explicit spelling — same declaration, same column, one answer.
  rpc ReplaceDirectoryPlan(ReplaceDirectoryPlanReq) returns (ReplaceDirectoryPlanResp) {
    option (w17.touches_entities) = "DirectoryPlanSummary";

    option (w17.db.method) = {
      ops: {
        name: "main",
        dql:
          "UPDATE users.UserDirectoryPlan SET :plan "
          "WHERE id = :id RETURNING id"
      }
    };
  }
}
