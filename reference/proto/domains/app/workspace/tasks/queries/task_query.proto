// TenantNote scope-fixture read side.
// GetTenantNote returns a single note by id; the auto-WHERE
// applied by storage codegen prevents tenant A from reading
// tenant B's row (the WHERE picks the row by id AND
// tenant_id, so cross-tenant lookups return ErrNoRows → 404).
//
// Response is flat scalars matching the canonical
// "single-fetch" convention in this codebase (mirror of
// GetUserResp). Avoids the wrapper-message scan path that
// would need dotted aliases on every SELECT target.
message GetTenantNoteReq {
  int64 id = 1;
}
message GetTenantNoteResp {
  int64                     id         = 1;
  string                    tenant_id  = 2;
  string                    title      = 3;
  string                    body       = 4;
  google.protobuf.Timestamp created_at = 5;
}

// ListTenantNotes returns every note in the caller's tenant.
// No request fields — the scope filter does all the work.
// List-shape (`repeated TenantNote notes`) so the codegen
// picks the multi-row scan path; per-row target is TenantNote
// directly, so the SELECT projects bare column names that
// match TenantNote's proto field names 1:1.
message ListTenantNotesReq {}

// StreamTenantNotesReq — the request of a SERVER STREAM over a SCOPED model
// that carries a VALIDATED field. That combination did not compile until
// 2026-10-01: the validation block resolves its messages through
// `i18n.T(ctx, …)` and a streaming handler has no `ctx` parameter, so a
// consumer's `codegen` exited 0 on a handler `go build` refused. The
// generator tests now pin it by parsing; this method is where it is BUILT and
// RUN (rest/0695, rest/0696).
message StreamTenantNotesReq {
  string title = 1 [(w17.field) = { min_len: 1 }];
}
message TenantNoteStreamRow {
  int64  id    = 1;
  string title = 2;
}
message ListTenantNotesResp {
  repeated e2e.app.tasks.TenantNote notes = 1;
}

