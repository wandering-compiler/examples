// Carries the two defaulted columns. They are absent from every write
// path in this project, so the only way a value gets in there is the
// column default — which is exactly the claim being read back.
message GetMilestoneResp {
  int64  id            = 1;
  string name          = 2;
  int32  weight        = 3;
  string status_note   = 4;
  double weight_factor = 5;
  // Read back so the write of these two is provable at all. On its own
  // an empty value here proves nothing — proto3 omits an empty
  // repeated and an empty bytes from the JSON, so "written empty" and
  // "never written" look identical on the wire. The suite therefore
  // asserts the NON-empty pair through this response and lets the
  // empty pair be proven by the create succeeding, which is the thing
  // that actually breaks.
  repeated string tags = 6;
  bytes attachment = 7;
}

// The reference-catalogue admin surface (see the TaskCategoryAdmin
// page in admin.proto). Both methods exist so `tasks.TaskCategory`
// has an admin page at all — which is the only place the model ACL
// axis is observable, and TaskCategory is the one model in this
// project that declares `(w17.acl_model) = false`.
//
// They sit on TaskQuery, NOT on TaskLookupQuery: that service
// declares `(w17.acl_service) = false`, so a page bound to it would
// have neither ACL axis and "the model axis is off" could not be
// told apart from "nothing is on". Here the file-level cascade keeps
// the endpoint axis, so the page gates on the endpoint and on
// nothing else — which is exactly the claim being measured.
message ListTaskCategoriesAdminReq {}

message ListTaskCategoriesAdminResp {
  repeated e2e.app.tasks.TaskCategory categories = 1;
}

