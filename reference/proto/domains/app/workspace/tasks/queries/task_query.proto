// as it's the only `repeated <Msg>` on the response). `paging`
// is mandatory: codegen errors at build time if a `w17.Paging`
// field is missing on a paged endpoint's response.
message ListTasksPagedResp {
  repeated e2e.app.tasks.Task items  = 1;
  w17.Paging                  paging = 2;
}

// Request/response for the PagedConfig override fixture. Same shape
// as ListTasksPaged's pair — empty request (the gateway derives the
// paging params from the REST annotation), one repeated field, one
