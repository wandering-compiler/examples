// Cursor-paging fixture.
//
// Request is intentionally empty — the gateway derives `cursor`
// + `limit` query params from the REST annotation's `paged`
// config (defaults: cursor=cursor, limit=limit, default_limit=20,
// max_limit=100), and the cursor itself carries the original
// (empty) request bytes on resume. Adding filter fields here
// later is a pure additive change: they'd flow through to the
// storage WHERE clause and would survive every page transition
// via the cursor's embedded request bytes.
// The delivery-fallback poll source's pair. No `w17.Paging` field:
// its absence IS the declaration that the whole working set comes
// back in one response, which is what makes it usable as a fallback
// source at all.
message ListTasksLiveReq {}
