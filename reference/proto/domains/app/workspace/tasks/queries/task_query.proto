  repeated e2e.app.tasks.Task items  = 1;
  w17.Paging                  paging = 2;
}

// Cursor paging OVER A JOIN — the admin-list shape (a list row
// that shows a foreign key as a human handle instead of a raw
// id). Two rules meet here:
//
//   - the joined display column MUST be COALESCE-wrapped, or a
//     row whose parent was deleted scans NULL into a string and
//     500s the whole list;
//   - the response is `{repeated <row>; w17.Paging}`, which is a
//     paged LIST, not the fan-out `{Parent; repeated Child}` —
//     the JOIN is many-to-one, no row multiplies.
//
// The `w17.Paging` envelope is not a shape field, so the
// combination is a paged list. The keyset WHERE, the per-variant
// sort queries and the Paging.Total COUNT(*) all carry the JOIN.
message ListTasksPagedWithCategoryReq {}

// A read projection, not a table message — the row carries one
// column the Task model doesn't have (`category`, joined off
// TaskCategory) plus the task columns the list shows.
message TaskPagedRow {
  int64                     id          = 1;
  string                    title       = 2;
  int64                     category_id = 3;
  string                    category    = 4;
  google.protobuf.Timestamp created_at  = 5;
}

message ListTasksPagedWithCategoryResp {
  repeated TaskPagedRow items  = 1;
  w17.Paging            paging = 2;
}

// The backlog report — the one request in this project that carries
// CROSS-FIELD validation, `(w17.validate)`.
//
// Per-field `(w17.field)` rules judge one value on its own. These
// judge a COMBINATION, which is where a request can be individually
// well-formed and jointly nonsense: a priority window that is empty, a
// title filter that excludes what it includes, a report that widens
// its own scope with no reason recorded.
//
// Every rule kind is here, on purpose. The emitter resolves each rule
// against the request's field paths and SILENTLY emits nothing when a
// path does not resolve or carries the wrong kind (see emitLessThan /
// the validation emitter) — a dropped rule is not a codegen error, it is
// an absence. That is why the emitted body has to be checked per rule
// rather than trusting that "the annotation is there".
//
// Each rule carries an explicit `message:`; codegen refuses a
// cross-field rule without one, because the auto-generated default
// leaks proto field names into user-facing prose.
message ListTasksInPriorityRangeReq {
  // The window. Both required — a report over "any priority" is the
  // default 0..9, stated rather than implied.
  int32 min_priority = 1 [(w17.field) = { type: NUMBER, gte: 0, lte: 9 }];
  int32 max_priority = 2 [(w17.field) = { type: NUMBER, gte: 0, lte: 9 }];

  // Exact-title include / exclude. Optional (presence-bearing), so an
  // omitted one drops its predicate via the DQL `?` marker.
  optional string title_is     = 3 [(w17.field) = { type: CHAR, max_len: 200, null: true }];
  optional string title_is_not = 4 [(w17.field) = { type: CHAR, max_len: 200, null: true }];

  // Narrowing by ONE grouping dimension.
  optional int64 category_id = 5;
  optional int64 project_id  = 6;

  // Drop one status from the report (e.g. leave out DONE).
  optional int32 exclude_status = 7;

  // Keep only one status. An optional ENUM under a `?` conjunct with
  // EQUALITY — the combination this example was missing, and the one
  // where a lost presence is fatal rather than harmless.
  //
  // Every other optional here is an int32 / string, which already bound
  // as a presence-bearing pointer, and `exclude_status` uses `<>`,
  // where collapsing an unset value onto 0 filters nothing visible
  // because no row carries the UNSPECIFIED sentinel. Under `=` the same
  // collapse asks for `status = 0` and empties the whole report — no
  // error, just a page that looks like "nothing matched". An
  // instance of this shape without an e2e case is emitted and never
  // executed.
  optional e2e.app.tasks.Task.Status only_status = 9;

  // Why this report was run. Audit metadata — deliberately NOT a
  // filter, and the only field here that reaches no SQL.
  string reason = 8 [(w17.field) = { type: CHAR, max_len: 200, null: true }];

  option (w17.validate) = {
    rules: [
      // An inverted window returns nothing and reads like a bug in
      // the caller, not like an empty result.
      { kind: LESS_THAN, lhs: "min_priority", rhs: "max_priority",
        message: "the lowest priority in the window must be below the highest one" },

      // Two grouping dimensions at once is an intersection nobody
      // means to ask for; the report has one grouping axis.
      { kind: AT_MOST_ONE, fields: ["category_id", "project_id"],
        message: "narrow the report by a category or by a project, not by both at once" },

      // Dropping a status narrows the report in a way a reader of the
      // output cannot see, so it has to be recorded.
      { kind: REQUIRED_IF, field: "reason", when_field: "exclude_status",
        message: "leaving a status out of the report needs a reason on record" },

      // A report that is not about one specific task is a survey, and
      // surveys get audited.
      { kind: REQUIRED_UNLESS, field: "reason", unless_field: "title_is",
        message: "a report that is not narrowed to one title needs a reason on record" },

      // Including and excluding the same text yields an empty report
      // for a reason the caller would spend a while looking for.
      { kind: NOT_CONTAINS, field: "title_is", against_fields: ["title_is_not"],
        message: "the title you filter for cannot contain the title you exclude — the report would always come back empty" },

      // `title_is` is an EXACT match, not a LIKE pattern. A caller
      // typing SQL wildcards expects them to work; they do not.
      { kind: MATCHES, field: "title_is", pattern: "^[^%_]*$",
        message: "the title filter matches exactly and takes no SQL wildcards — drop the % and _ characters" }
    ]
  };
}

// One report row. A projection, not a table message.
message TaskPriorityRow {
  int64  id       = 1;
  string title    = 2;
  int32  priority = 3;
}

message ListTasksInPriorityRangeResp {
  repeated TaskPriorityRow items = 1;
}

// MilestoneSortField — the sort dimension of ListMilestonesSorted,
// and the only place in this project where
// `(w17.db.enum_value).sort_sql` is declared.
//
// `ORDER BY :sort_by` is the compiler's ONE schema-driven
// sort-by-parameter form: the caller sends an enum value, codegen
// expands it into a static `CASE :sort_by WHEN <num> THEN <fragment>
// END` per value, and no caller-supplied text ever reaches the ORDER
// BY clause. Which orderings the endpoint can serve is therefore
// fixed at compile time, by this enum.
//
// The three arms are deliberately three DIFFERENT shapes of
// fragment, because a fragment is spliced into SQL verbatim and each
// shape goes down its own emit path:
//
//   * UNSPECIFIED carries NO fragment. It is the documented "no
//     sort" sentinel — every CASE arm returns NULL, so the query's
//     trailing `m.id ASC` decides the order. It is also the value a
//     blanket "proto3 zero means omitted" request rule refuses,
//     which answers 400 on the one value the feature defines as
//     meaningful; the omit-the-parameter case is what keeps that
//     from coming back here.
//
//   * BY_WEIGHT carries TWO keys. SQL forbids ASC/DESC inside a
//     `CASE ... THEN <expr>` branch, so a multi-key fragment must be
//     split on its top-level comma into one enum-gated CASE per key
//     — unsplit it emits `THEN m.weight DESC, m.name ASC END`, which
//     no database parses. The second key is not decoration: the
//     fixture rows tie on weight, so dropping it falls back to
//     `m.id ASC` and reverses that pair.
//
//   * BY_TARGET carries ONE key whose column is a function call, so
//     the fragment contains a comma that must NOT split and a
//     direction that must still be lifted out of the CASE branch.
//     Splitting here truncates the SQL mid-call.
enum MilestoneSortField {
  MILESTONE_SORT_UNSPECIFIED = 0;
  MILESTONE_SORT_BY_WEIGHT   = 1 [(w17.db.enum_value) = { sort_sql: "m.weight DESC, m.name ASC" }];
  MILESTONE_SORT_BY_TARGET   = 2 [(w17.db.enum_value) = { sort_sql: "coalesce(m.target_count, 0) DESC" }];
}

message ListMilestonesSortedReq {
  MilestoneSortField sort_by = 1;
}

// One milestone row. The sort KEYS are not all projected — the
// ordering has to come out of the SQL, not out of anything the
// assertion could re-derive from the response.
message MilestoneRow {
  int64  id     = 1;
  string name   = 2;
  int32  weight = 3;
}

