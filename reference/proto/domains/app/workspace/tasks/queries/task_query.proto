message GetTaskUploadReq {
  int64 id = 1;
}
// Both path fields carry the SAME stored handle, and the response
// renders them differently — that difference is the whole of what a
// download endpoint's field selector does.
//
// The gateway rewrites every response field that is BOTH an UPLOADED_*
// field AND covered by a download endpoint, replacing the raw storage
// handle with a URL under that endpoint's prefix. So which endpoint
// covers a field is legible from the value the caller receives:
//
//   stored_path — covered by the `/files` download → a RELATIVE URL
//                 under that prefix, which is what a browser fetches.
//   storage_key — EXCLUDED from `/files` and covered by `/blobs`
//                 instead → an ABSOLUTE URL under the other prefix.
//
// Two prefixes and two URL forms in one response. A selector that
// ignored `exclude` would put both under `/files`; one that ignored
// `url_form` would render both the same way. Neither can be mistaken
// for correct.
message GetTaskUploadResp {
  int64  id      = 1;
  int64  task_id = 2;
  string stored_path = 3 [(w17.field) = {
    type: UPLOADED_FILE,
    extensions: ["txt", "md"],
    upload: {
      connection:       "app-uploads",
      bucket_path:      "/task-attachments",
      expected_objects: 100000,
      max_per_bucket:   100,
      max_size_bytes:   65536
    }
  }];
  string storage_key = 4 [(w17.field) = {
    type: UPLOADED_FILE,
    extensions: ["txt", "md"],
    upload: {
      connection:       "app-uploads",
      bucket_path:      "/task-attachments",
      expected_objects: 100000,
      max_per_bucket:   100,
      max_size_bytes:   65536
    }
  }];
}

