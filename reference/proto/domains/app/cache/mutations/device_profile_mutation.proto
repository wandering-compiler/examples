syntax = "proto3";

package e2e.app.cache;

import "google/protobuf/timestamp.proto";
import "w17/db.proto";
import "domains/app/cache/types/models.proto";

// DeviceProfileMutation — the HASH-layout write surface, and the
// host of the cross-op KV handover.

message SetDeviceProfileReq {
  string                    device_id    = 1;
  int64                     user_id      = 2;
  string                    platform     = 3;
  google.protobuf.Timestamp last_seen_at = 4;
}
// A Redis HSET returns an ack, not a row; there is nothing to
// project that the caller does not already hold.
message SetDeviceProfileResp {}

message RevokeDeviceSessionReq {
  string device_id = 1;
}
message RevokeDeviceSessionResp {}

service DeviceProfileMutation {
  rpc SetDeviceProfile(SetDeviceProfileReq) returns (SetDeviceProfileResp) {
    option (w17.db.method) = {
      ops: {
        name: "cache",
        dql:
          "INSERT INTO cache.CachedDeviceProfile SET "
          "device_id = :device_id, user_id = :user_id, "
          "platform = :platform, last_seen_at = :last_seen_at"
      }
    };
  }

  // RevokeDeviceSession — the HASH-layout cross-op chain.
  //
  // A multi-op KV method whose non-final op is a GET has to hand
  // its decoded entity to a later op — a non-final GET nothing
  // consumes is refused outright — and that handover is its own
  // body shape: the read is rendered as an assignment into an
  // outer-scope var rather than into `resp`, and the later op binds
  // `:<op>.<column>` against that var. Every KV method in the
  // example before these two was single-op or SET+DEL, so the
  // handover had never been emitted for either layout.
  //
  // The chain is one the caller genuinely cannot run itself: it
  // holds a device id, and the user id it needs to address the
  // presence record exists only inside the value the first op
  // decodes.
  rpc RevokeDeviceSession(RevokeDeviceSessionReq) returns (RevokeDeviceSessionResp) {
    option (w17.db.method) = {
      ops: [
        {
          name: "device",
          dql:  "SELECT c FROM cache.CachedDeviceProfile c WHERE c.device_id = :device_id"
        },
        {
          name: "presence",
          dql:  "DELETE FROM cache.UserPresenceCache WHERE user_id = :device.user_id"
        }
      ]
    };
  }
}
