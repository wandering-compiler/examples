# What this example adds to the generated stack (compose.w17.yaml), merged
# over it by the include in compose.yaml: the seed rows the suite starts
# from, the hand-written business server of the app domain, and the
# gateway's route to it.
services:
  # One-shot: applies the rendered seed of fixtures/app/test.json (rendered
  # into w17/fixtures by `w17ctl fixtures render`) with the storage binary
  # itself; the binary refuses a seed older than its fixture. The schema is
  # in place by then: `w17ctl test` builds it, and seeds the generated
  # roles, before the services start.
  app-seed:
    build:
      context: .
      dockerfile: w17/services/app-storage/Dockerfile
      args: [GOPROXY, GOSUMDB, GODEBUG]
    environment:
      # The database a `fixtures apply` seeds is the connection's target.
      W17_TARGET_APP_POSTGRES: postgres://app:${W17_APP_POSTGRES_DB_PASSWORD:-app}@app-postgres:5432/app?sslmode=disable
    command: ["fixtures", "apply", "--connection", "app-postgres", "--fixtures", "/w17/fixtures"]
    restart: "no"
    volumes:
      - ./w17/fixtures:/w17/fixtures:ro
      - ./fixtures/app/test.json:/fixtures/app/test.json:ro
    depends_on:
      app-postgres: { condition: service_healthy }

  app-storage:
    depends_on:
      app-seed: { condition: service_completed_successfully }

  app-business:
    build: { context: ., dockerfile: business/Dockerfile, args: [GOPROXY, GOSUMDB, GODEBUG] }
    restart: unless-stopped
    environment:
      APP_LISTEN_ADDR: ":50051"
      APP_STORAGE_BACKEND_ADDR: app-storage:50051
      # The cross-domain usage calls are best-effort; this example runs
      # without them.
      APP_BILLING_BACKEND_ADDR: disabled
      # Error reports go to a fake Sentry the live suite serves on the
      # stack's network (livetest/run.sh starts it under this name), which
      # reads back what a report carries. Reports sent before it is up are
      # lost, and none are.
      W17_SENTRY_DSN: http://livetest@livetest-sentry:8090/1
    depends_on:
      app-storage: { condition: service_started }

  # The domain's subscriber keeps an audit trail of the request event stream
  # in Redis (the app domain's requestaudit package), which the live suite reads.
  app-eventbus:
    environment:
      APP_REQUEST_AUDIT_REDIS_ADDR: app-redis:6379
    depends_on:
      app-redis: { condition: service_healthy }

  # The gateway sends storage methods to app-storage and the facade
  # methods to the business server. (The admin's defaults already name
  # app-business:50051.)
  app-gateway:
    environment:
      APP_GATEWAY_STORAGE_BACKEND_ADDR: app-storage:50051
      APP_GATEWAY_BUSINESS_BACKEND_ADDR: app-business:50051
      # The `app-uploads` store is a bucket here, not a directory: the root is
      # an s3:// URL, and the binary picks the driver from it (a path is a
      # directory, the generated default). The gateway creates the bucket at
      # boot, as it creates a directory root. The live suite (livetest/)
      # reads the bucket back to prove the image variants landed in it.
      APP_GATEWAY_UPLOAD_APP_UPLOADS_ROOT: s3://minioadmin:minioadmin@app-uploads?endpoint=http://minio:9000&region=us-east-1&path_style=true
    depends_on:
      app-business: { condition: service_started }
      minio: { condition: service_healthy }

  # An S3-compatible object store for the uploads (MinIO). Its image comes
  # from Chainguard: the Docker Hub and Quay images are gone.
  minio:
    image: cgr.dev/chainguard/minio@sha256:2136d593beacf4461187035eca949fe49abd589d5079735025c711ca58fee0c8
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MC_HOST_local: http://minioadmin:minioadmin@localhost:9000
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 5s
      retries: 30
