# TaskAdmin detail read — hand-authored (pre-empts the generate-if-missing
# scaffold, which would fill a non-numeric placeholder id and 400). The
# TaskAdmin page's detail binds tasks.TaskQuery.GetTaskAdmin, the task row
# itself — the shape its create form and pickers speak; the {id} URL segment
# stamps the request's `id` field. Reads the first seeded task (700001,
# category 1 — fixtures/app/test.json), so the fields the form names come
# back filled. The cursor-paging proof itself is 0040/0041.
method: admin.TaskAdmin.Read
pre:
    - auth/admin.yaml
input:
    id: "700001"
expect:
    id: {matcher: eq, value: "700001"}
    category_id: {matcher: eq, value: "1"}
    title: {matcher: not_empty}
