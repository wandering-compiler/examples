# THE refusal half of the MCP permission gate.
#
# The MCP surface is an OAuth protected resource ((w17.mcp_api).oauth), so a
# caller reaches it with an MCP access token the auth plugin's authorization
# server issued — the runner obtains one through the consent RPC with the
# scenario's session — and that token holds the user's roles of realm `mcp`
# alone. `auth_nogrant.yaml` is a seeded account that holds none, so its
# token holds no permission on this surface at all, and the resource refuses
# it at the door: HTTP 403 with `WWW-Authenticate: Bearer
# error="insufficient_scope"` (RFC 6750 §3.1), before any JSON-RPC — the
# runner reads it as PERMISSION_DENIED. A caller holding some mcp
# permission but not this tool's would instead find the tool filtered out
# of tools/list (mcp.Server.filterTools) and answered `tool not found`.
#
# 0020 is the other half: the same surface, the same transport, a caller
# who HAS the permission, and the call goes through.
#
# `auth_nogrant.yaml` goes LAST: every auth fixture captures the same
# reserved `auth.token` slot, so the final one wins.
method: auth.AuthService.WhoAmI
pre:
    - auth/auth.yaml
    - auth/auth_nogrant.yaml
input: {}
expect_error:
    code: PERMISSION_DENIED
