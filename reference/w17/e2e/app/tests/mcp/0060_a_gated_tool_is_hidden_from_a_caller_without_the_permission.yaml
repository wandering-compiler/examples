# THE refusal half of the MCP permission gate.
#
# The MCP surface is an OAuth protected resource (mcp.proto): its access
# token holds the user's mcp-realm roles alone. A caller who holds none
# gets a token that passes no gate, and the surface refuses it before any
# tool is resolved — a coded PERMISSION_DENIED (with an
# `insufficient_scope` challenge naming the surface's metadata), not the
# JSON-RPC `tool not found` the filter answered when the surface took the
# REST session. A coded refusal is asserted with `expect_error`: a step
# that accepted any failure would keep passing for a malformed request.
#
# 0020 is the other half: the same surface, the same transport, a caller
# who HAS the permission, and the call goes through.
#
# `auth_nogrant.yaml` goes LAST: every auth fixture captures the same
# reserved `auth.token` slot, so the final one wins. The caller is
# authenticated (the step still needs a token — an open surface is not an
# anonymous one) and holds an empty UserRole set.
method: auth.AuthService.WhoAmI
pre:
    - auth/auth.yaml
    - auth/auth_nogrant.yaml
input: {}
expect_error:
    code: PERMISSION_DENIED
