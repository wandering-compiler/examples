# A task cover: an UPLOADED_IMAGE whose `variants` (thumb, card) the gateway
# renders in the background once this insert has succeeded.
#
# The file here is text, so it only has to pass what the gateway checks
# while streaming — the part name `image`, an extension on the field's
# allow-list, the size cap. A non-image under `.png` is stored as any
# upload is; its variants answer 415 when asked for. 0823 uploads a
# generated PNG, and 0825–0829 fetch it and its variants back.
method: tasks.TaskMutation.UploadTaskCover
pre:
    - auth/auth.yaml
input:
    task_id: 700001
files:
    - part: image
      filename: cover.png
      content: "a cover the e2e runner can carry as text"
expect:
    id: {capture: task_cover.id, match: {matcher: not_empty}}
