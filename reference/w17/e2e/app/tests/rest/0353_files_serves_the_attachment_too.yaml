# A download route serves BUCKETS, not fields. `/files` excludes
# `storage_key`, which only decides that the response renders that field
# under `/blobs` — the object lives in the `/task-attachments` bucket, which
# `/files` serves for `stored_path`, so a caller with no credential gets it
# from `/files` all the same.
#
# Asserted on purpose: it is the behaviour, and the trap. A file meant to be
# private is private only in a bucket no public route serves; a project
# proves that with this step expecting NOT_FOUND instead.
download:
    url: ${task_upload.blob_url}
    route: /files
anonymous: true
expect:
    w17_wire.body: "hello from the e2e upload"
