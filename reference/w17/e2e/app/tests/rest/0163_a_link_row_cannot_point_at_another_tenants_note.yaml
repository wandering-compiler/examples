# tenant-beta tries to tag tenant-ALPHA's note, and the database refuses.
#
# This used to SUCCEED, and the fixture that made it succeed said why in
# its own comment: "a foreign key is not tenant-aware, so nothing stops
# beta from pointing a link row of its own at it". The row that landed
# carried beta's tenant_id (the UPSERT auto-stamp guarantees that much)
# while its note_id belonged to alpha — a reference across the tenant
# boundary, written through the ordinary API.
#
# Both models are scoped by `tenant_id`, so the reference is now emitted
# as a COMPOSITE foreign key over that axis:
#
#   FOREIGN KEY (tenant_id, note_id) REFERENCES tenant_notes (tenant_id, id)
#
# TenantNoteLink and TenantNoteTag are the same shape one declaration apart:
# this one declares `fk:`, the other deliberately does not, so 0154 / 0159
# keep a scenario in which the JOIN-side predicate is the only defence.
#
# beta's tenant_id paired with alpha's note_id matches no row in the
# parent, so PG rejects the write outright. The refusal is the assertion:
# it is the write side of the isolation, and it holds for every writer —
# raw SQL included — rather than depending on each reader remembering to
# filter.
#
# ⚠️ This does NOT retire the read-side scope predicates. A composite FK
# cannot be enforced across CONNECTIONS (the migrator drops the DB-level
# constraint at its connection-bucketing seam, because no engine can
# reference into another database), and it says nothing about rows that
# predate it. The JOIN-side predicate remains the defence there.
method: tasks.TaskMutation.AttachTenantNoteLink
pre:
    - fixtures/a_tenant_note.yaml
    - auth/auth_beta.yaml
input:
    note_id: ${note.id}
    label: e2e-xlink-${seq}
expect_error:
    code: INVALID_ARGUMENT
    # The refusal has to NAME the field. A message that only classified the
    # failure ("fk violation") told the caller which database concept was
    # upset and nothing they could act on; anchoring on `note_id` is what
    # makes this case fail if the field ever drops back out.
    #
    # It anchors on the DETAIL rather than the message, because that is where
    # the field-level half travels now: `message` carries the one sentence
    # written for a person and reads the same for every InvalidArgument, while
    # `details[]` carries what a form can act on. The constraint registry the
    # codegen emits is what turns a PG constraint name into this entry, so the
    # case still fails if that mapping is lost.
    details:
        - field: note_id
          code: INVALID_VALUE
          message: {matcher: regex, pattern: "referenced record does not exist"}
