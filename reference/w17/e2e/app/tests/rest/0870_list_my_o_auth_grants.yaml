# The user's connected apps. The REST scenario's user approved no OAuth
# client (that is the MCP scenario's flow, under its own user), so the list
# is empty — and answered, not refused: a user with no connected apps sees
# an empty page, never an error.
method: auth.AuthService.ListMyOAuthGrants
pre:
    - auth/auth.yaml
input: {}
expect:
    grants: {matcher: empty}
