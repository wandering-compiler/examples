# Scoped M:N read: TenantNote is the FROM, TenantNoteTag arrives
# through a JOIN. The generated SQL carries TWO injected tenant
# predicates — `n.tenant_id` on the WHERE and `nt.tenant_id` on the
# JOIN's ON clause. This step proves the pair does not over-filter:
# the caller's own tagged note still comes back.
#
# 0153 is the other half (the same tag read by another tenant returns
# nothing); neither step means much without the other.
method: tasks.TaskQuery.ListTenantNotesByTag
pre:
    - fixtures/a_tenant_note_tag.yaml
input:
    tag: ${tag.value}
expect:
    notes: {matcher: count, op: '==', value: 1}
