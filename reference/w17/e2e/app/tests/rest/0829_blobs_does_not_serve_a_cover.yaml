# The same object asked of `/blobs`, signed in: that route serves only the
# buckets of the fields it includes (`GetTaskUploadResp.storage_key`, the
# attachments' bucket), so a cover — stored under `/task-covers` — is not
# found there.
download:
    url: ${task_cover_image.url}
    route: /blobs
pre:
    - auth/auth.yaml
expect_error:
    code: NOT_FOUND
