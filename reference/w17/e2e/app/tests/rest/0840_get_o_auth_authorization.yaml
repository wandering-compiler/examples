# Edit, then REGENERATE before running: the suite executes the BAKED
# copy of this file (scenarios_gen_test.go), not the file itself.
# `w17ctl codegen` && `w17ctl test` — skip the regen and the run
# silently asserts the previous expectations and passes.
method: auth.AuthService.GetOAuthAuthorization
pre:
    - auth/auth.yaml
input:
    request_id: e2e-value
expect:
    client_name: {matcher: not_empty}
    client_uri: {matcher: not_empty}
    logo_uri: {matcher: not_empty}
    client_id: {matcher: not_empty}
    redirect_host: {matcher: not_empty}
    kind: {matcher: not_empty}
    resource: {matcher: not_empty}
    scope: {matcher: not_empty}
    expires_at: {matcher: not_empty}
    orgs: {matcher: unwritten}
