# `(w17.RestGroup).downloads` — the field selector and the URL form,
# both read off ONE response.
#
# `stored_path` and `storage_key` hold the SAME stored handle: the
# read's DQL selects the column twice. Everything that differs between
# them below was decided by the download endpoints, not by the data.
#
#   stored_path — `/attachments` includes it exactly → RELATIVE URL
#   storage_key — `/blobs` includes it exactly       → ABSOLUTE URL
#
# The public `/files` includes `tasks.*` and EXCLUDES both: attachments
# are private, and a download serves the whole bucket of every field it
# covers.
#
# Three declarations are each refuted by a different half of this:
#
#   * `include` — a selector resolving to nothing would leave both
#     fields carrying the raw handle, with no prefix at all.
#   * `exclude` — ignored, `tasks.*` on `/files` would claim both fields
#     a second time, which codegen refuses, and a selector that let it
#     through would render one of them under `/files`.
#   * `url_form` — the two endpoints declare different forms, so a
#     renderer that ignored the field would emit the same shape twice.
#     RELATIVE starts at `/`; ABSOLUTE carries the origin the gateway
#     read from APP_GATEWAY_PUBLIC_HOST at boot.
#
# The trailing key is the same in both, and asserting it twice is the
# point: the rewrite must change the PREFIX and leave the object
# identity alone.
#
# The `/blobs` URL is captured for 0351 and 0352, which fetch it.
method: tasks.TaskQuery.GetTaskUpload
pre:
    - auth/auth.yaml
input:
    id: ${task_upload.id}
expect:
    stored_path: {matcher: regex, pattern: "^/api/v1/tasks/attachments/task-attachments/[0-9a-f]{2}/[0-9a-f]{2}/[0-9a-f]{64}-[0-9a-f]{32}$"}
    storage_key: {matcher: regex, pattern: "^http://[^/]+/api/v1/tasks/blobs/task-attachments/[0-9a-f]{2}/[0-9a-f]{2}/[0-9a-f]{64}-[0-9a-f]{32}$", capture: task_upload.blob_url}
