# `PagedConfig.cursor_param` — the endpoint resumes from `after`, not
# from `cursor`.
#
# The assertion is `previous_cursor`, and it is chosen because it is the
# one thing that is DETERMINISTIC here. Its contract: empty when the
# caller arrived without a cursor, non-empty otherwise. So an endpoint
# that IGNORED `after` would answer page one — same row count, same
# shape, but an empty `previous_cursor`. That single field separates
# "resumed" from "restarted"; a count cannot.
#
# The obvious assertion — that page two's first id is greater than page
# one's last — is not available: ids here are not predictable (every
# fixture run creates more tasks, so which ids land on which page depends
# on how many ran first), and the `num` matcher takes a literal, not a
# captured value. 0400 captures `tuned.last_id` for that comparison and
# it could not be used; the capture is kept because it costs nothing and
# documents the intent.
#
# 🔴 The unpredictability used to be explained the other way round: "the
# seeded rows use a high block because explicit ids do not advance an
# IDENTITY sequence, so every task a fixture creates gets a LOW id and
# sorts ahead of them". The seed now advances the sequence, so created tasks sort AFTER the seeds instead of before —
# the conclusion this case rests on is unchanged, its reason is not.
#
# The cursor is minted in this test's own pre chain, after its own sign-in:
# a cursor is bound to the user who minted it, so resuming 0400's (minted
# for an account an earlier test signed up) is refused — 0028 asserts that.
method: tasks.TaskQuery.ListTasksPagedTuned
pre:
    - auth/auth.yaml
    - fixtures/a_tuned_page_one.yaml
input:
    after: ${tuned_own.cursor}
expect:
    items: {matcher: count, op: '==', value: 2}
    paging.previous_cursor: {matcher: not_empty}
