# org-beta tags org-ALPHA's note.
#
# The link row is legitimately writable: alpha's note id is just an
# integer, and a foreign key is not org-aware, so nothing stops beta
# from pointing a link row of its own at it. The row that lands carries
# beta's org_id (the UPSERT auto-stamp guarantees that much) while
# its note_id belongs to alpha.
#
# That is the setup for 0154 — the one shape where ONLY the JOIN-side
# scope predicate stands between alpha and another organization's data.
method: tasks.TaskMutation.AttachOrgNoteTag
pre:
    - fixtures/an_org_note.yaml
    - auth/auth_beta.yaml
input:
    note_id: ${note.id}
    tag: e2e-xtag-${seq}
expect:
    note_id: {matcher: not_empty}
    tag: {capture: xtag.value}
