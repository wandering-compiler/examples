# A note owned by the SECOND organization.
#
# Every other OrgNote in this suite is written by org-alpha, so
# until this fixture existed the whole table belonged to one organization —
# which means a cross-organization read had nothing cross-organization to find. The
# scope-bypass case asserted `count >= 1` and leaned on a companion case
# to establish that the CALLER owned none of them; that is state
# standing in for the assertion, and it hid the fact that the data set
# could not have distinguished a working bypass from a broken one on
# org_id at all.
#
# org_id is omitted on purpose, as in every other note fixture: it is
# auto-stamped from the caller's scope, which is why the auth fixture
# above has to be a path that genuinely re-authenticates.
method: tasks.TaskMutation.CreateOrgNote
pre:
    - auth/auth_beta_writer.yaml
input:
    title: e2e beta note
    body: written by org-beta so a cross-scope read has two organizations to find
expect:
    id: {capture: beta_note.id}
