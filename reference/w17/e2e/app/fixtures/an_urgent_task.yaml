# Creates a task in the seeded "urgent" category (id 3) and captures its id —
# the row the write guards in 0213–0216 refuse to touch.
method: tasks.TasksService.CreateTask
pre:
    - auth/auth.yaml
headers:
    Idempotency-Key: "e2e-create-urgent-${random:uuid}"
input:
    user_id: 1
    category_id: 3
    title: e2e urgent task
    body_text: e2e urgent task body
    priority: 1
expect:
    id: {capture: urgent.id}
