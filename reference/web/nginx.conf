# The built bundle, served as static files. Every path the app routes on the
# client falls back to index.html; hashed assets are cached for good, the
# index never (it names the current assets).
server {
  listen 8080;
  root /usr/share/nginx/html;

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
